name: Bilan hebdo du Crous 📊

on:
  schedule:
    # Vendredi soir ~18h15 Paris. Heure d'été ET d'hiver sont programmées ; le step
    # "Gate" écarte celle qui tombe hors de 18h00–21h00 Paris, et le script n'envoie
    # de toute façon qu'UNE image par semaine (drapeau `bilan_sent` dans l'historique).
    - cron: "17 16 * * 5"   # 18h17 Paris (été, UTC+2)
    - cron: "17 17 * * 5"   # 18h17 Paris (hiver, UTC+1)

  workflow_dispatch:
    inputs:
      force_run:
        description: "Renvoyer même si le bilan de la semaine a déjà été envoyé"
        type: boolean
        default: true
      dry_run:
        description: "Générer bilan_preview.png sans rien envoyer (voir les logs)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bilan
  cancel-in-progress: false

jobs:
  bilan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🚦 Gate (18h00–21h00 Paris)
        id: gate
        run: |
          NOW=$(TZ=Europe/Paris date +%H%M)
          echo "Heure de Paris : $NOW"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$((10#$NOW))" -ge 1800 ] && [ "$((10#$NOW))" -le 2100 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hors plage : ignoré (doublon cron été/hiver)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 📦 Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: 📊 Générer et envoyer le bilan
        if: steps.gate.outputs.go == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python -u bilan.py

      - name: 🖼️ Aperçu (dry run)
        if: steps.gate.outputs.go == 'true' && github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bilan-preview
          path: bilan_preview.png

      - name: 💾 Enregistrer le drapeau « bilan envoyé »
        if: steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "bilan: semaine envoyée [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
