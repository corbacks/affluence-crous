name: Affluence du Crous 🏃

on:
  schedule:
    # Le cron ne sert PLUS qu'à DÉMARRER le bot (GitHub ne garantit pas l'heure
    # exacte d'un cron : retards de 10 à 60 min possibles). Une fois lancé, le
    # script se contrôle lui-même toutes les 2 min jusqu'à 13h35 (heure de Paris).
    # ATTENTION : les crons GitHub sont en UTC.
    #   Été  (UTC+2) : 09:07 UTC = 11h07 Paris
    #   Hiver (UTC+1) : 10:07 UTC = 11h07 Paris
    # Départ visé 11h07, avec un secours à 11h37. Les deux saisons sont programmées ;
    # le step "Gate" écarte les départs hors de la plage 11h00–13h30 Paris, et la
    # concurrency empêche deux boucles en parallèle.
    - cron: "7 2 * * 1-5"    # 11h07 Paris (été)
    - cron: "37 2 * * 1-5"   # secours 11h37 (été)
    - cron: "7 3 * * 1-5"   # 11h07 Paris (hiver) / 12h07 en été : dernier secours
    - cron: "37 3 * * 1-5"
    - cron: "7 4 * * 1-5"    # 11h07 Paris (été)
    - cron: "37 4 * * 1-5"   # secours 11h37 (été)
    - cron: "7 9 * * 1-5"    # 11h07 Paris (été)
    - cron: "37 9 * * 1-5"   # secours 11h37 (été)
    - cron: "7 10 * * 1-5"   # 11h07 Paris (hiver) / 12h07 en été : dernier secours
    - cron: "37 10 * * 1-5"  # secours 11h37 (hiver) / 12h37 en été

  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignorer le garde-fou week-end (test manuel)"
        type: boolean
        default: true
      dry_run:
        description: "Afficher le message dans les logs sans l'envoyer à Discord"
        type: boolean
        default: false

# Le workflow commite data/history.json (historique des repas) : droit d'écriture requis.
permissions:
  contents: write

# Un seul run automatique à la fois : un départ de secours attend puis sort aussitôt.
# Les tests manuels ont leur propre groupe : ils ne font jamais la queue derrière
# la boucle d'un run automatique.
concurrency:
  group: affluence-${{ github.event_name == 'workflow_dispatch' && 'manuel' || 'auto' }}
  cancel-in-progress: false

jobs:
  affluence:
    runs-on: ubuntu-latest
    timeout-minutes: 170      # 11h00 → 13h35 + marge

    steps:
      - name: 🚦 Gate (plage de départ 11h00–13h30 Paris)
        id: gate
        run: |
          NOW=$(TZ=Europe/Paris date +%H%M)
          echo "Heure de Paris : $NOW"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$((10#$NOW))" -ge 1100 ] && [ "$((10#$NOW))" -le 1330 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hors plage : départ ignoré (doublon cron été/hiver ou grand retard)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: 📂 Restore state
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: affluence_state.json
          key: affluence-state-${{ github.run_id }}
          restore-keys: |
            affluence-state-

      - name: 🏃 Surveiller l'affluence (boucle jusqu'au bilan de 13h30)
        if: steps.gate.outputs.go == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          # Test manuel : un seul contrôle (pas de boucle de 2h30)
          POLL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '0' || '120' }}
          LOOP_UNTIL: "13:35"
        run: python -u affluence_bot.py

      - name: 💾 Save state
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: affluence_state.json
          key: affluence-state-${{ github.run_id }}

      # L'historique des repas (relevés, prévisions, totaux) alimente les prévisions du
      # lendemain et l'image du vendredi. Il est commité dans le dépôt : il ne s'efface
      # jamais, contrairement au cache. Le push avec GITHUB_TOKEN ne relance aucun workflow.
      - name: 📈 Enregistrer l'historique (data/history.json)
        if: always() && steps.gate.outputs.go == 'true' && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Rien à enregistrer."
          else
            git commit -m "stats: $(TZ=Europe/Paris date +%F) [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push
          fi
