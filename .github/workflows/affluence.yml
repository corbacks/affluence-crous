name: Affluence du Crous 🏃

on:
  schedule:
    # Le cron ne sert PLUS qu'à DÉMARRER le bot (GitHub ne garantit pas l'heure
    # exacte d'un cron : retards de 10 à 60 min possibles). Une fois lancé, le
    # script se contrôle lui-même toutes les 2 min jusqu'à 13h35 (heure de Paris).
    # Départ visé 11h07 Paris, 30 min avant l'ouverture du service : même avec
    # un retard, il démarre avant les premiers repas. Deux déclencheurs de secours
    # 30 min plus tard. Heure d'été ET d'hiver sont programmées ; le step "Gate"
    # écarte les départs hors de la plage 11h00–13h30 Paris.
    - cron: "7 3 * * 1-5"    # 11h07 Paris (été, UTC+2)
    - cron: "37 3 * * 1-5"   # secours 11h37 (été)
    - cron: "7 4 * * 1-5"   # 11h07 Paris (hiver, UTC+1)
    - cron: "37 4 * * 1-5"  # secours 11h37 (hiver)

  workflow_dispatch:
    inputs:
      force_run:
        description: "Ignorer le garde-fou week-end (test manuel)"
        type: boolean
        default: true
      dry_run:
        description: "Afficher le message dans les logs sans l'envoyer à Discord"
        type: boolean
        default: false

# Un seul run à la fois : si un départ de secours arrive pendant qu'un run tourne,
# il attend, puis sort aussitôt (heure de fin dépassée).
concurrency:
  group: affluence
  cancel-in-progress: false

jobs:
  affluence:
    runs-on: ubuntu-latest
    timeout-minutes: 170      # 11h00 → 13h35 + marge

    steps:
      - name: 🚦 Gate (plage de départ 11h00–13h30 Paris)
        id: gate
        run: |
          NOW=$(TZ=Europe/Paris date +%H%M)
          echo "Heure de Paris : $NOW"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$((10#$NOW))" -ge 1100 ] && [ "$((10#$NOW))" -le 1330 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Hors plage : départ ignoré (doublon cron été/hiver ou grand retard)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 📥 Checkout
        if: steps.gate.outputs.go == 'true'
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        if: steps.gate.outputs.go == 'true'
        run: pip install -r requirements.txt

      - name: 📂 Restore state
        if: steps.gate.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: affluence_state.json
          key: affluence-state-${{ github.run_id }}
          restore-keys: |
            affluence-state-

      - name: 🏃 Surveiller l'affluence (boucle jusqu'à 13h35)
        if: steps.gate.outputs.go == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          FORCE_RUN: ${{ github.event.inputs.force_run || '0' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          POLL_SECONDS: "120"
          LOOP_UNTIL: "13:35"
        run: python -u affluence_bot.py

      - name: 💾 Save state
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: affluence_state.json
          key: affluence-state-${{ github.run_id }}
